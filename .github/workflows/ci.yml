name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when new commits are pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mark this job ("checks") as a required status check on `main`
  # so a PR can't be merged until it passes.
  checks:
    runs-on: ubuntu-latest
    env:
      # Only read by prisma.config.ts / db.ts at load time; nothing connects in CI.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      # Node 24: the API loads packages/prisma's .ts files via type stripping,
      # and Jest needs native require(esm).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # contract.json / contract.d.ts are gitignored, so generate them first.
      - name: Generate Prisma contract
        run: bun run --cwd packages/prisma contract:emit

      - name: Type-check
        run: bun run check-types

      - name: Test
        run: bun run test
