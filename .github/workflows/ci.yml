name: CI

on:
  pull_request:

# Cancel an older run when new commits are pushed to the same PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Only read by prisma.config.ts / db.ts at load time; nothing connects in CI.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci

# Mark both checks ("Type check" and "Tests") as required status checks on `main`
# so a PR can't be merged until both pass.
jobs:
  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # From the npm registry, not GitHub Releases (whose downloads 504).
      - run: npm install -g bun@1.3.13
      - run: bun install --frozen-lockfile
      # contract.json / contract.d.ts are gitignored, so generate them first.
      - name: Generate Prisma contract
        run: bun run --cwd packages/prisma emit
      - name: Type-check
        run: bun run check-types

  tests:
    name: Tests
    runs-on: ubuntu-latest
    # Redis for the RedisModule integration tests. Service containers cannot set
    # --requirepass, so CI Redis has no password (unlike docker-compose.yml).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      # Node 24: the API loads packages/prisma's .ts files via type stripping,
      # and Jest needs native require(esm).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # From the npm registry, not GitHub Releases (whose downloads 504).
      - run: npm install -g bun@1.3.13
      - run: bun install --frozen-lockfile
      # Tests import @repo/prisma, which needs the generated contract too.
      - name: Generate Prisma contract
        run: bun run --cwd packages/prisma emit
      - name: Test
        run: bun run test
